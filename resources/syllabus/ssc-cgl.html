<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus Engine | SarkariNokri</title>
    
    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* Critical Layout Fixes */
        html, body {
            height: auto;
            overflow-x: hidden;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #syllabus-root {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 20px;
            display: block;
            min-height: 80vh;
        }

        .loader-box {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #666;
        }

        /* Brand Bar Styling */
        .brand-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #1a1a1a;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand-links a {
            color: #ddd;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .brand-links a:hover {
            color: #fff;
        }
    </style>
</head>
<body>

<header class="brand-bar">
   <div class="brand-logo" onclick="navTo('index.html')" style="cursor:pointer">SarkariNokriEngine</div>
   <nav class="brand-links">
      <a href="javascript:void(0)" onclick="navTo('index.html')">Home</a>
      <a href="javascript:void(0)" onclick="navTo('railways.html')">Railway</a>
      <a href="javascript:void(0)" onclick="navTo('ssc.html')">SSC</a>
      <a href="javascript:void(0)" onclick="navTo('bank.html')">Bank</a>
   </nav>
</header>

<script>
/**
 * navTo: Prevents "Escaping the Repo". 
 * Forces navigation to stay within /sarkarkinokri/ on GitHub.
 */
function navTo(page) {
    const isGitHub = window.location.hostname.includes('github.io');
    const repoBase = isGitHub ? '/sarkarkinokri/' : '/';
    
    // Clean up the page name and combine with base
    const target = (repoBase + page).replace(/\/+/g, '/');
    
    console.log("🚀 Internal Routing to:", target);
    window.location.href = target;
}
</script>

<main id="syllabus-root">
    <div class="loader-box" id="engine-loader">
        Initializing Syllabus Engine...
    </div>
</main>

<div id="popup-ad-container"></div>
<div id="sticky-footer-ad"></div>

<script src="../js/loader.js"></script>
<script src="../js/main.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Determine the Master ID for this specific page
    // Change this ID for your SBI, SSC, or Railway clusters
    const currentPageId = "ssc-cgl"; 

    if (typeof SyllabusEngine !== "undefined") {
        console.log("🛠️ Starting Engine for:", currentPageId);
        
        SyllabusEngine.init({
            masterId: currentPageId,
            container: "#syllabus-root",
            loaderId: "#engine-loader"
        });
    } else {
        console.error("❌ SyllabusEngine not found in main.js");
        document.getElementById('engine-loader').innerText = "Engine Load Error.";
    }
});
</script>

</body>
</html>
